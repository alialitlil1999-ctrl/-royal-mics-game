<div class="actions"><button id="guess">✨ طلّع تخمين</button><button class="alt" id="reset">إعادة</button></div>
<section class="result"><strong>نتيجة التخمين</strong><div class="chips" id="result">اضغط طلّع تخمين</div></section>
<div class="note">كل رمز يظهر مرة واحدة فقط في التخمين الواحد. الذرة والعنب فرصتهما أعلى، والأخطبوط والفروجة نادران. التخمين عشوائي للتسلية وليس توقعاً مضموناً.</div>
</main>
<script>
const items=[
{id:'chicken',name:'فروجة',emoji:'🍗',w:.22},
{id:'strawberry',name:'فراولة',emoji:'🍓',w:1},
{id:'octopus',name:'أخطبوط',emoji:'🐙',w:.22},
{id:'corn',name:'ذرة',emoji:'🌽',w:2.1},
{id:'fish',name:'سمچ',emoji:'🐟',w:1},
{id:'lettuce',name:'خس',emoji:'🥬',w:1},
{id:'meat',name:'لحم',emoji:'🥩',w:1},
{id:'grapes',name:'عنب',emoji:'🍇',w:2.1}
];
function weighted(pool){let n=Math.random()*pool.reduce((s,x)=>s+x.w,0);for(const x of pool){n-=x.w;if(n<=0)return x}return pool[pool.length-1]}
document.getElementById('guess').onclick=()=>{
 let pool=[...items],out=[];
 while(out.length<6){const x=weighted(pool);out.push(x);pool=pool.filter(y=>y.id!==x.id)}
 document.querySelectorAll('.hot').forEach(el=>el.classList.toggle('sel',out.some(x=>x.id===el.dataset.id)));
 document.getElementById('result').innerHTML=out.map(x=>`<span class="chip">${x.emoji} ${x.name}</span>`).join('');
};
document.getElementById('reset').onclick=()=>{
 document.querySelectorAll('.hot').forEach(el=>el.classList.remove('sel'));
 document.getElementById('result').textContent='اضغط طلّع تخمين';
};
</script></body></html>
